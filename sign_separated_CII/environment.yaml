# Conda environment for the CII emulator pipeline (Linux / Intel macOS).
#
# Apple Silicon (macOS arm64) users: use environment-macos-arm64.yaml instead.
#
# To create:
#   conda env create -f environment.yaml
#
# To activate:
#   conda activate cii_emu
#
# To update an existing env:
#   conda env update -f environment.yaml --prune

name: cii_emu

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip

  - pip:
    - tensorflow==2.13.0
    - keras==2.13.1
    - keras-tuner==1.4.8
    - scikit-learn>=1.5
    - numpy<2                    # TF 2.13 is incompatible with numpy 2.x
    - matplotlib>=3.8
    - emcee>=3.1                 # affine-invariant ensemble sampler
    - tqdm                       # progress bars for emcee sampling
    - joblib                     # serialise GP model bundle (transitive dep of sklearn)
